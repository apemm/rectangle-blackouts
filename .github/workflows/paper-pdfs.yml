name: Rebuild paper PDFs

# Compiles the two papers and the supplement when their sources change on main,
# and commits the PDFs that changed. Run it by hand from the Actions tab to
# rebuild everything.

on:
  push:
    branches: [main]
    paths:
      - 'papers/**/*.tex'
      - 'papers/**/*.bib'
      - 'papers/**/*.bst'
      - 'papers/**/*.sty'
      - '!papers/enumeration/blackouts_enumeration.tex'
      - '.github/workflows/paper-pdfs.yml'
  workflow_dispatch:

concurrency:
  group: paper-pdfs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Compile with the pinned TeX Live environment
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          docker_image: ghcr.io/xu-cheng/texlive-alpine@sha256:c06416ebbc69c8e90e07d1f1a6f7a3f9b334e773daa3543ce879ea533317c3a7
          run: |
            set -e
            apk add --no-cache python3
            pdflatex --version | head -n 1
            TEX="pdflatex -interaction=nonstopmode -halt-on-error"

            cd papers/extremal
            $TEX blackouts_extremal
            bibtex blackouts_extremal
            $TEX blackouts_extremal
            $TEX blackouts_extremal
            $TEX supplement
            $TEX supplement
            cd ../..

            cd papers/enumeration
            $TEX main
            bibtex main
            $TEX main
            $TEX main
            python3 make_single_file.py
            $TEX blackouts_enumeration
            $TEX blackouts_enumeration
            cd ../..

      - name: Keep the compilation logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: paper-logs-${{ github.run_id }}
          path: papers/**/*.log
          retention-days: 14

      - name: Commit the PDFs that changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f papers/extremal/blackouts_extremal.pdf papers/extremal/supplement.pdf \
                     papers/extremal/blackouts_extremal.bbl \
                     papers/enumeration/blackouts_enumeration.pdf papers/enumeration/blackouts_enumeration.tex
          if git diff --cached --quiet; then
            echo "No PDF changed."
          else
            git commit -m "Rebuild paper PDFs"
            git push origin HEAD:main
          fi
